name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_target:
        description: Publish destination for a manual package validation
        required: true
        type: choice
        options:
          - testpypi
        default: testpypi

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-and-build:
    name: Validate and build distributions
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project and development dependencies
        run: uv sync --locked --extra dev

      - name: Run release quality gates
        run: |
          uv run ruff format --check .
          uv run ruff check .
          uv run mypy src/mtn_cloud
          uv run pytest -q
          git diff --check

      - name: Verify tag matches project version
        if: github.event_name == 'push'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          uv run python - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          if not re.fullmatch(r"v\d+\.\d+\.\d+", tag):
              raise SystemExit(f"Release tag must use vMAJOR.MINOR.PATCH: {tag}")

          version = tomllib.loads(Path("pyproject.toml").read_text())[
              "project"
          ]["version"]
          if tag.removeprefix("v") != version:
              raise SystemExit(f"Release tag {tag} does not match project version {version}")
          print(f"Validated release {tag}")
          PY

      - name: Build distributions
        run: uv build

      - name: Validate distributions
        run: uv run --with twine twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  create-github-release:
    name: Create GitHub Release
    needs: validate-and-build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/

      - name: Create GitHub Release and attach distributions
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*

  publish-testpypi:
    name: Publish to TestPyPI
    needs: validate-and-build
    if: github.event_name == 'workflow_dispatch' && inputs.publish_target == 'testpypi'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/

      - name: Publish to TestPyPI with trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: Publish to PyPI
    needs:
      - validate-and-build
      - create-github-release
    if: >-
      always() && needs.validate-and-build.result == 'success' &&
      needs.create-github-release.result == 'success' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/

      - name: Publish to PyPI with trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
