name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_SYSTEM_PYTHON: "false"

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project and development dependencies
        run: uv sync --locked --extra dev

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Run lint checks
        run: uv run ruff check .

      - name: Run type checks
        run: uv run mypy src/mtn_cloud

      - name: Verify package metadata and build
        run: uv build

      - name: Check repository diff hygiene
        run: git diff --check

  tests:
    name: Tests / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        # Test the minimum supported version, the primary CI version, and the
        # newest supported version. Platform-specific jobs belong in release
        # qualification, not every pull request.
        python-version: ["3.10", "3.12", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project and development dependencies
        run: uv sync --locked --extra dev

      - name: Run unit tests
        if: matrix.python-version != '3.12'
        run: uv run pytest -q

      - name: Run coverage on primary Python version
        if: matrix.python-version == '3.12'
        run: uv run pytest -q --cov=mtn_cloud --cov-report=term-missing --cov-report=xml

      - name: Upload coverage artifact
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-py${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: error

  live-read-only:
    name: Read-only live contract tests
    if: github.event_name == 'workflow_dispatch' && vars.MTN_CLOUD_LIVE_TESTS == 'true'
    runs-on: ubuntu-latest
    environment: live-read-only
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project and development dependencies
        run: uv sync --locked --extra dev

      - name: Run read-only live contract tests
        env:
          MTN_CLOUD_RUN_LIVE_TESTS: "1"
          MTN_CLOUD_TOKEN: ${{ secrets.MTN_CLOUD_TOKEN }}
          MTN_CLOUD_API_KEY: ${{ secrets.MTN_CLOUD_API_KEY }}
        run: uv run pytest tests/integration -q -m "not mutation"
